name: Docs

# Builds pennychest.github.io from the docs in pennychest and the plugin READMEs in
# pennychest-plugins. Both repositories send a "docs" dispatch here when their docs change.
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [docs]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: site-builder
      - uses: actions/checkout@v7
        with:
          repository: pennychest/pennychest
          path: core
      - uses: actions/checkout@v7
        with:
          repository: pennychest/pennychest-plugins
          path: plugins
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: core/docs/requirements.txt
      - run: pip install -r core/docs/requirements.txt
      - run: python site-builder/assemble.py core plugins
      - run: mkdocs build --strict -f core/mkdocs.yml -d "$GITHUB_WORKSPACE/site"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
